name: Safe validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate PBIR and TMDL inventory
        run: python validation/project_inventory.py
      - name: Regenerate deterministic dataset
        run: python generator/generate_dataset.py
      - name: Run safe tests
        run: python -m unittest discover -s tests -v
      - name: Verify tracked and untracked reproducibility
        run: python validation/verify_clean_tree.py
