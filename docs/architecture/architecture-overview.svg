<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura completa do EDY SOC Analytics</title>
  <desc id="desc">Fluxo dos dados sintéticos pelo Power Query, modelo TMDL com DAX e RLS parcial, relatório PBIR, Power BI Desktop, evidências, testes locais e CI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080c12"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#273244" stroke-width="1" opacity="0.22"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7d8cff"/>
    </marker>
    <style><![CDATA[
      .kicker{font:600 16px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#39c6e6}
      .h1{font:700 40px 'Segoe UI',Arial,sans-serif;fill:#f5f8fc}
      .sub{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#aebbd0}
      .lane-title{font:700 17px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px;fill:#c9d5e6}
      .card-title{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#f5f8fc}
      .body{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#aebbd0}
      .small{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#8fa0b8}
      .chip{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#0d1118}
      .lane{fill:#0f1620;stroke:#273244;stroke-width:1.5}
      .source{fill:#14202c;stroke:#39c6e6;stroke-width:2}
      .process{fill:#171d2f;stroke:#7d8cff;stroke-width:2}
      .semantic{fill:#18251f;stroke:#46c78c;stroke-width:2}
      .caution{fill:#2b2416;stroke:#f2b84b;stroke-width:2}
      .report{fill:#231b2d;stroke:#b28cff;stroke-width:2}
      .arrow{fill:none;stroke:#7d8cff;stroke-width:2.5;marker-end:url(#arrow)}
      .arrow-cyan{fill:none;stroke:#39c6e6;stroke-width:2.5;marker-end:url(#arrow)}
      .arrow-green{fill:none;stroke:#46c78c;stroke-width:2.5;marker-end:url(#arrow)}
    ]]></style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <rect width="1800" height="1120" fill="url(#grid)"/>

  <text x="70" y="62" class="kicker">EDY SOC ANALYTICS · BLUE TEAM DATA PRODUCT</text>
  <text x="70" y="112" class="h1">Arquitetura completa e verificável</text>
  <text x="70" y="148" class="sub">Dados sintéticos → ETL → modelo semântico → análise operacional → evidências e quality gates</text>
  <rect x="1510" y="54" width="220" height="44" rx="22" fill="#39c6e6"/>
  <text x="1620" y="81" text-anchor="middle" class="chip">POWER BI · PBIP/PBIR</text>

  <!-- Lane 1 -->
  <rect x="50" y="190" width="330" height="700" rx="18" class="lane"/>
  <text x="78" y="230" class="lane-title">01 · GERAÇÃO SINTÉTICA</text>
  <g filter="url(#shadow)">
    <rect x="78" y="258" width="274" height="112" rx="12" class="source"/>
    <text x="98" y="290" class="card-title">Gerador Python</text>
    <text x="98" y="318" class="body">seed fixa 75075</text>
    <text x="98" y="342" class="small">manifesto + SHA-256</text>

    <rect x="78" y="400" width="274" height="122" rx="12" class="source"/>
    <text x="98" y="432" class="card-title">data/raw</text>
    <text x="98" y="460" class="body">120.720 eventos brutos</text>
    <text x="98" y="484" class="small">nulls · duplicidades · labels variantes</text>

    <rect x="78" y="552" width="274" height="112" rx="12" class="source"/>
    <text x="98" y="584" class="card-title">data/reference</text>
    <text x="98" y="612" class="body">dimensões + SecurityAccess</text>
    <text x="98" y="636" class="small">identidades example.invalid</text>

    <rect x="78" y="694" width="274" height="164" rx="12" class="source"/>
    <text x="98" y="726" class="card-title">data/expected</text>
    <text x="98" y="754" class="body">oracle reproduzível</text>
    <text x="98" y="780" class="small">120.000 eventos · 18.000 alertas</text>
    <text x="98" y="802" class="small">3.200 incidentes</text>
    <text x="98" y="830" class="small">também alimenta lifecycle, SLA e bridge</text>
  </g>

  <!-- Lane 2 -->
  <rect x="410" y="190" width="320" height="700" rx="18" class="lane"/>
  <text x="438" y="230" class="lane-title">02 · POWER QUERY M</text>
  <g filter="url(#shadow)">
    <rect x="438" y="258" width="264" height="128" rx="12" class="process"/>
    <text x="458" y="290" class="card-title">Ingestão parametrizada</text>
    <text x="458" y="318" class="body">pProjectRoot + fxCsv</text>
    <text x="458" y="342" class="small">UTF-8 · modo Import</text>
    <text x="458" y="364" class="small">caminho local ajustável</text>

    <rect x="438" y="418" width="264" height="188" rx="12" class="process"/>
    <text x="458" y="450" class="card-title">Conformação</text>
    <text x="458" y="480" class="body">tipagem · trim · normalização</text>
    <text x="458" y="506" class="body">deduplicação · chaves</text>
    <text x="458" y="532" class="body">membros desconhecidos</text>
    <text x="458" y="568" class="small">eventos · alertas · incidentes</text>

    <rect x="438" y="638" width="264" height="124" rx="12" class="process"/>
    <text x="458" y="670" class="card-title">Qualidade segura</text>
    <text x="458" y="698" class="body">DQ_RejectedRows</text>
    <text x="458" y="724" class="small">motivo sem payload operacional</text>
  </g>

  <!-- Lane 3 -->
  <rect x="760" y="190" width="360" height="700" rx="18" class="lane"/>
  <text x="788" y="230" class="lane-title">03 · MODELO SEMÂNTICO TMDL</text>
  <g filter="url(#shadow)">
    <rect x="788" y="258" width="304" height="150" rx="12" class="semantic"/>
    <text x="808" y="290" class="card-title">Modelo estrela</text>
    <text x="808" y="320" class="body">21 tabelas · 27 relações</text>
    <text x="808" y="346" class="body">dimensões conformadas</text>
    <text x="808" y="374" class="small">bridge MITRE bidirecional controlada</text>

    <rect x="788" y="440" width="304" height="130" rx="12" class="semantic"/>
    <text x="808" y="472" class="card-title">Camada DAX</text>
    <text x="808" y="502" class="body">41 medidas explícitas</text>
    <text x="808" y="528" class="small">volume · SLA · tempos · MITRE · risco</text>

    <rect x="788" y="602" width="304" height="208" rx="12" class="caution"/>
    <text x="808" y="634" class="card-title">RLS demonstrativa</text>
    <text x="808" y="664" class="body">SOC_Manager · visão integral</text>
    <text x="808" y="692" class="body">SOC_Analyst · equipe em DimAnalyst</text>
    <text x="808" y="730" class="small">ESCOPO PARCIAL</text>
    <text x="808" y="754" class="small">incidentes são restringidos;</text>
    <text x="808" y="776" class="small">eventos e alertas permanecem globais</text>
  </g>

  <!-- Lane 4 -->
  <rect x="1150" y="190" width="300" height="700" rx="18" class="lane"/>
  <text x="1178" y="230" class="lane-title">04 · RELATÓRIO PBIR</text>
  <g filter="url(#shadow)">
    <rect x="1178" y="258" width="244" height="164" rx="12" class="report"/>
    <text x="1198" y="290" class="card-title">Signal Grid</text>
    <text x="1198" y="320" class="body">10 páginas</text>
    <text x="1198" y="346" class="body">101 visuais nativos</text>
    <text x="1198" y="376" class="small">drillthrough · cross-filter</text>
    <text x="1198" y="398" class="small">bookmark + ClearAllSlicers</text>

    <rect x="1178" y="454" width="244" height="138" rx="12" class="report"/>
    <text x="1198" y="486" class="card-title">Mobile</text>
    <text x="1198" y="516" class="body">91 estados · largura 320</text>
    <text x="1198" y="544" class="small">rolagem vertical sem sobreposição</text>

    <rect x="1178" y="624" width="244" height="150" rx="12" class="report"/>
    <text x="1198" y="656" class="card-title">Acessibilidade</text>
    <text x="1198" y="686" class="body">alt text 101/101</text>
    <text x="1198" y="712" class="body">tab order determinística</text>
    <text x="1198" y="740" class="small">tabelas como alternativa textual</text>
  </g>

  <!-- Lane 5 -->
  <rect x="1480" y="190" width="270" height="700" rx="18" class="lane"/>
  <text x="1508" y="230" class="lane-title">05 · EXECUÇÃO</text>
  <g filter="url(#shadow)">
    <rect x="1508" y="258" width="214" height="180" rx="12" class="report"/>
    <text x="1528" y="290" class="card-title">Power BI Desktop</text>
    <text x="1528" y="320" class="body">2.157.879.0</text>
    <text x="1528" y="350" class="small">refresh · round-trip</text>
    <text x="1528" y="374" class="small">View As · export real</text>
    <text x="1528" y="402" class="small">modelo local ADOMD</text>

    <rect x="1508" y="470" width="214" height="184" rx="12" class="report"/>
    <text x="1528" y="502" class="card-title">Evidências</text>
    <text x="1528" y="532" class="body">PDF · screenshots</text>
    <text x="1528" y="560" class="body">desktop + mobile</text>
    <text x="1528" y="590" class="small">folhas de contato</text>
    <text x="1528" y="614" class="small">relatório acadêmico</text>
  </g>

  <!-- Main arrows -->
  <path d="M352 320 C390 320 400 320 438 320" class="arrow-cyan"/>
  <path d="M352 462 C392 462 398 492 438 492" class="arrow-cyan"/>
  <path d="M352 606 C390 606 400 548 438 548" class="arrow-cyan"/>
  <path d="M352 776 C394 776 402 718 438 718" class="arrow-cyan"/>
  <path d="M702 510 C740 510 750 332 788 332" class="arrow"/>
  <path d="M702 700 C742 700 750 374 788 374" class="arrow"/>
  <path d="M1092 505 C1130 505 1140 340 1178 340" class="arrow-green"/>
  <path d="M1092 700 C1134 700 1140 690 1178 690" class="arrow-green"/>
  <path d="M1422 340 C1460 340 1470 348 1508 348" class="arrow"/>

  <!-- Quality gates -->
  <rect x="50" y="930" width="1700" height="142" rx="18" fill="#0f1620" stroke="#273244" stroke-width="1.5"/>
  <text x="78" y="968" class="lane-title">06 · QUALITY GATES · CI E VALIDAÇÃO LOCAL</text>
  <g>
    <rect x="78" y="988" width="378" height="60" rx="10" class="process"/>
    <text x="98" y="1014" class="card-title">CI Safe validation</text>
    <text x="98" y="1036" class="small">suíte Python + inventário estático · árvore limpa</text>
    <rect x="484" y="988" width="360" height="60" rx="10" class="process"/>
    <text x="504" y="1014" class="card-title">PBIR oficial</text>
    <text x="504" y="1036" class="small">schemas oficiais · gate com rede</text>
    <rect x="872" y="988" width="360" height="60" rx="10" class="process"/>
    <text x="892" y="1014" class="card-title">Modelo vivo</text>
    <text x="892" y="1036" class="small">ADOMD local · baseline release 13/13</text>
    <rect x="1260" y="988" width="462" height="60" rx="10" class="process"/>
    <text x="1280" y="1014" class="card-title">Performance local</text>
    <text x="1280" y="1036" class="small">5 consultas DAX × 5 warm runs · captura das 10 páginas</text>
  </g>
</svg>
